<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>井字棋 EfficientZero</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>井字棋强化学习</h1>
      <p>使用简化的 EfficientZero 通过自我博弈学习。</p>
    </header>

    <section class="controls">
      <div class="train-panel">
        <h2>训练控制</h2>
        <label>自博弈局数：<input type="number" id="games" value="8" min="1" /></label>
        <label>MCTS 模拟：<input type="number" id="sims" value="40" min="10" step="10" /></label>
        <button id="train">开始训练</button>
        <div id="train-status"></div>
      </div>
      <div class="status-panel">
        <h2>状态</h2>
        <div id="status">加载中...</div>
      </div>
    </section>

    <section class="board-section">
      <h2>对战</h2>
      <div class="board" id="board"></div>
      <div class="panel">
        <button id="reset">重开一局</button>
        <button id="agent-move">让 AI 走一步</button>
        <div id="message"></div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
